<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentia AI - Ultimate Study Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Overlay for Mobile backdrop when sidebar is open */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 90;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Responsive Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #2d2f31;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
        }

        .brand h2 {
            font-size: 1.15rem;
            color: #e3e3e3;
            font-weight: 600;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: #8e918f;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 50%;
            display: none; /* Mobile par show hoga */
        }

        .close-sidebar-btn:hover {
            color: #ffffff;
            background: #282a2c;
        }

        .new-chat-btn {
            background-color: #282a2c;
            color: #e3e3e3;
            border: 1px solid #3c4043;
            padding: 12px 16px;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            width: 100%;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #333538;
        }

        .chat-history {
            margin-top: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .history-title {
            font-size: 0.75rem;
            color: #8e918f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-left: 8px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #c4c7c5;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .history-item:hover {
            background-color: #282a2c;
        }

        .sidebar-footer {
            font-size: 0.75rem;
            color: #8e918f;
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid #2d2f31;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Top Header Bar */
        .top-header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #2d2f31;
            background: #131314;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: #e3e3e3;
            cursor: pointer;
            font-size: 1.3rem;
            margin-right: 15px;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .toggle-btn:hover {
            background: #1e1f20;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-box {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Messages */
        .message-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .ai .avatar {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
        }

        .message-content {
            max-width: 80%;
            line-height: 1.6;
            font-size: 0.98rem;
            white-space: pre-wrap;
        }

        .user .message-content {
            background-color: #282a2c;
            padding: 12px 18px;
            border-radius: 18px;
            color: #e3e3e3;
        }

        .ai .message-content {
            color: #e3e3e3;
            padding-top: 4px;
        }

        .attached-media {
            max-width: 250px;
            max-height: 250px;
            border-radius: 12px;
            margin-top: 8px;
            display: block;
        }

        /* Bottom Input Bar */
        .input-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px 20px 20px;
            background-color: #131314;
        }

        .attachment-preview {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            padding: 0 10px;
        }

        .preview-item {
            position: relative;
            display: inline-block;
        }

        .preview-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #3c4043;
        }

        .remove-preview {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            max-width: 800px;
            background-color: #1e1f20;
            border: 1px solid #3c4043;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 6px 16px;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: #a8c7fa;
            background-color: #282a2c;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 1rem;
            padding: 10px 12px;
        }

        input::placeholder {
            color: #8e918f;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background-color: #3c4043;
            color: #ffffff;
        }

        .send-btn {
            color: #a8c7fa;
        }

        #file-input {
            display: none;
        }

        /* Mobile Adjustments & Sidebar Hiding */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .close-sidebar-btn {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay backdrop for Mobile -->
    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-header">
                <div class="brand">
                    <img src="1000261386.png" alt="Studentia AI Logo">
                    <h2>Studentia AI</h2>
                </div>
                <button class="close-sidebar-btn" onclick="closeSidebar()">✕</button>
            </div>

            <button class="new-chat-btn" onclick="clearChat()">
                <span>+</span> New Chat
            </button>

            <div class="chat-history">
                <div class="history-title">Recent Chats</div>
                <div class="history-item" onclick="closeSidebar()">Math - Homework Help</div>
                <div class="history-item" onclick="closeSidebar()">Physics - Newton Laws</div>
                <div class="history-item" onclick="closeSidebar()">Python Coding Notes</div>
            </div>
        </div>

        <div class="sidebar-footer">
            Studentia AI Pro v2.0
        </div>
    </div>

    <!-- Main Chat Content -->
    <div class="main-content">
        <div class="top-header">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <span style="font-weight: 500;">Studentia Study Space</span>
        </div>

        <div class="chat-container">
            <div id="chat-box" class="chat-box">
                <div class="message-row ai">
                    <div class="avatar">S</div>
                    <div class="message-content">Assalam-o-Alaikum! Main **Studentia AI** hoon. Aap koi bhi question pooch sakte hain, ya book, picture, aur files attach karke solution samajh sakte hain!</div>
                </div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-wrapper">
            <div class="attachment-preview" id="attachment-preview"></div>

            <div class="input-box">
                <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <input type="file" id="file-input" accept="image/*,video/*,application/pdf" onchange="handleFileSelect(event)">

                <input type="text" id="user-input" placeholder="Ask Studentia AI or paste question..." onkeypress="handleKeyPress(event)">

                <button class="icon-btn" onclick="startVoiceInput()" title="Voice Typing">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>

                <button class="icon-btn send-btn" onclick="sendMessage()" title="Send">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "YOUR_GEMINI_API_KEY"; // Yahan apni Gemini API key paste karein
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        const SYSTEM_INSTRUCTION = `You are "Studentia AI", an expert educational tutor for students.
Your task is to help students learn effectively across all academic subjects (Maths, Physics, Chemistry, Biology, Computer Science, History, Grammar, etc.).
Rules:
1. Explain concepts step-by-step in simple language.
2. If an image is provided, solve it step-by-step.
3. Keep formatting clean with bullet points and clear headers.
4. Support Roman Urdu, English, and Hindi.`;

        let selectedFileData = null;

        /* Sidebar Toggle Fix Functions */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1];
                selectedFileData = {
                    mime_type: file.type,
                    data: base64Data,
                    previewUrl: e.target.result,
                    isImage: file.type.startsWith('image/')
                };

                const previewContainer = document.getElementById('attachment-preview');
                previewContainer.innerHTML = `
                    <div class="preview-item">
                        <img src="${selectedFileData.previewUrl}" alt="Attachment">
                        <button class="remove-preview" onclick="removeAttachment()">✕</button>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }

        function removeAttachment() {
            selectedFileData = null;
            document.getElementById('attachment-preview').innerHTML = '';
            document.getElementById('file-input').value = '';
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const userText = inputField.value.trim();

            if (!userText && !selectedFileData) return;

            appendUserMessage(userText, selectedFileData);

            const filePayload = selectedFileData ? {
                inline_data: {
                    mime_type: selectedFileData.mime_type,
                    data: selectedFileData.data
                }
            } : null;

            inputField.value = "";
            removeAttachment();

            const loadingElement = appendAIMessage("Studentia solution prepare kar raha hai...");

            try {
                const contentsParts = [];
                if (filePayload) contentsParts.push(filePayload);
                if (userText) contentsParts.push({ text: userText });

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                        contents: [{ role: "user", parts: contentsParts }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    loadingElement.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    loadingElement.innerText = "Error: Answer load nahi ho saka.";
                }
            } catch (error) {
                console.error("Error:", error);
                loadingElement.innerText = "Network Error! API Key check karein.";
            }
        }

        function appendUserMessage(text, fileData) {
            const chatBox = document.getElementById("chat-box");
            const rowDiv = document.createElement("div");
            rowDiv.className = "message-row user";

            let mediaHTML = "";
            if (fileData && fileData.isImage) {
                mediaHTML = `<br><img src="${fileData.previewUrl}" class="attached-media">`;
            }

            rowDiv.innerHTML = `<div class="message-content">${escapeHTML(text)}${mediaHTML}</div>`;
            chatBox.appendChild(rowDiv);
            scrollToBottom();
        }

        function appendAIMessage(text) {
            const chatBox = document.getElementById("chat-box");
            const rowDiv = document.createElement("div");
            rowDiv.className = "message-row ai";

            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerText = text;

            rowDiv.innerHTML = `<div class="avatar">S</div>`;
            rowDiv.appendChild(contentDiv);

            chatBox.appendChild(rowDiv);
            scrollToBottom();
            return contentDiv;
        }

        function scrollToBottom() {
            const chatContainer = document.querySelector(".chat-container");
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        function clearChat() {
            closeSidebar();
            document.getElementById("chat-box").innerHTML = `
                <div class="message-row ai">
                    <div class="avatar">S</div>
                    <div class="message-content">Assalam-o-Alaikum! Main **Studentia AI** hoon. Aap koi bhi question pooch sakte hain, ya book, picture, aur files attach karke solution samajh sakte hain!</div>
                </div>
            `;
        }

        function startVoiceInput() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ur-PK';

                recognition.onstart = function() {
                    document.getElementById('user-input').placeholder = "Listening... Bolen...";
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('user-input').value = transcript;
                    document.getElementById('user-input').placeholder = "Ask Studentia AI or paste question...";
                };

                recognition.onerror = function() {
                    document.getElementById('user-input').placeholder = "Voice error! Type karein...";
                };

                recognition.start();
            } else {
                alert("Browser voice recognition support nahi karta.");
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
